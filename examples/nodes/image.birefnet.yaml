id: image.birefnet
name: AI 抠图（BiRefNet / RMBG）
category: media
description: >-
  用开源模型 BiRefNet（MIT 协议，可商用）在本机抠图：照片、复杂背景、头发丝都能处理，输出透明 PNG 和黑白蒙版。
  不联网、不按次收费。使用前在节点面板里点「下载模型」（轻量版约 224 MB，完整版约 973 MB），只需下载一次。
  也可以选 BRIA 的 RMBG-2.0：注意它是 CC BY-NC 4.0 协议，仅限非商业用途（商用要和 BRIA 另签授权），
  下载需要 Hugging Face 账号先在模型页同意条款，并在模型面板里保存 access token。
  白底的设计图用「去白底」更快也更可控。
inputs:
  image:
    type: file
    description: 要抠图的图片（png / jpg / webp 等）
params:
  type: object
  properties:
    model:
      type: string
      enum: [birefnet-lite, birefnet, rmbg-2.0, rmbg-2.0-int8]
      default: birefnet-lite
      description: >-
        birefnet-lite 速度快、约 224 MB；birefnet 边缘和细节更好，约 973 MB，更慢（两者 MIT 协议，可商用）。
        rmbg-2.0（约 1 GB）和 rmbg-2.0-int8（量化版，约 366 MB，更快）为 CC BY-NC 4.0，仅限非商用
    decontaminate:
      type: boolean
      default: true
      description: 去除边缘的背景色：把半透明边缘里混进去的原背景颜色去掉，解决抠完换到深色或彩色背景上出现的白边、色边
    edge_cutoff:
      type: number
      default: 0.1
      minimum: 0
      maximum: 0.45
      description: 边缘裁剪（0–0.45）：去掉很淡的半透明部分。还有一圈淡淡的背景就调大（如 0.2～0.3），边缘太硬、毛发变秃就调小
    edge_shrink:
      type: integer
      default: 0
      minimum: 0
      maximum: 20
      description: 边缘收缩（像素）：把主体边缘往里收几像素，直接切掉残留的背景边。一般 1～3，图越大可以越大
    edge_feather:
      type: number
      default: 0
      minimum: 0
      maximum: 10
      description: 边缘羽化（像素）：让边缘更柔和，常和「边缘收缩」一起用（比如收缩 2、羽化 1）
    threshold:
      type: number
      minimum: 0
      maximum: 1
      description: 硬边阈值（0–1）。不填保留柔和的半透明边缘（头发、毛发更自然）；填了以后蒙版只有全透明和不透明，比如 0.5，这时「边缘裁剪」不生效
outputs:
  image:
    type: file
    description: 抠好的透明 PNG
  mask:
    type: file
    description: 黑白蒙版（白色是保留的部分）
models:
  - id: birefnet-lite
    name: BiRefNet lite
    url: https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model.onnx
    size: 224
    license: MIT
    licenseUrl: https://huggingface.co/ZhengPeng7/BiRefNet_lite
    commercial: true
  - id: birefnet
    name: BiRefNet
    url: https://huggingface.co/onnx-community/BiRefNet-ONNX/resolve/main/onnx/model.onnx
    size: 973
    license: MIT
    licenseUrl: https://huggingface.co/ZhengPeng7/BiRefNet
    commercial: true
  - id: rmbg-2.0
    name: RMBG-2.0
    url: https://huggingface.co/briaai/RMBG-2.0/resolve/main/onnx/model.onnx
    size: 1024
    license: CC BY-NC 4.0
    licenseUrl: https://creativecommons.org/licenses/by-nc/4.0/
    commercial: false
    gated: true
    page: https://huggingface.co/briaai/RMBG-2.0
  - id: rmbg-2.0-int8
    name: RMBG-2.0 int8
    url: https://huggingface.co/briaai/RMBG-2.0/resolve/main/onnx/model_int8.onnx
    size: 366
    license: CC BY-NC 4.0
    licenseUrl: https://creativecommons.org/licenses/by-nc/4.0/
    commercial: false
    gated: true
    page: https://huggingface.co/briaai/RMBG-2.0
executor:
  kind: script
  language: js
  file: image.birefnet.mjs
timeout: 5m
cache: true
i18n:
  en:
    name: AI background removal (BiRefNet / RMBG)
    description: >-
      Remove backgrounds locally with the open-source BiRefNet model (MIT, commercial use OK): photos, busy backgrounds and hair
      all work; outputs a transparent PNG and a black-and-white mask. Offline, no per-image cost. Download the model once from the node's panel
      first (lite about 224 MB, full about 973 MB). BRIA's RMBG-2.0 is also available: it's CC BY-NC 4.0, non-commercial use only
      (commercial use needs a separate BRIA license), and downloading needs a Hugging Face account that accepted its terms plus an
      access token saved in the model panel. For designs on white, "Remove white background" is faster and more controllable.
    inputs:
      image: The image (png / jpg / webp…)
    params:
      model: >-
        birefnet-lite is fast (~224 MB); birefnet has better edges and detail (~973 MB) but is slower (both MIT, commercial use OK).
        rmbg-2.0 (~1 GB) and rmbg-2.0-int8 (quantized, ~366 MB, faster) are CC BY-NC 4.0, non-commercial only
      decontaminate: Remove the old background's color from semi-transparent edges, so there's no white or colored halo on a new background
      edge_cutoff: Drop the faintest semi-transparent parts (0–0.45). Raise it (0.2–0.3) if a faint ring of background remains; lower it if edges get too hard or hair thins out
      edge_shrink: Pull the subject's edge in by this many pixels, cutting off leftover background. Usually 1–3; more for large images
      edge_feather: Soften the edge by this many pixels; often paired with shrink (e.g. shrink 2, feather 1)
      threshold: Hard-edge cutoff (0–1). Empty keeps soft, semi-transparent edges (better for hair and fur); set e.g. 0.5 for fully opaque or fully transparent only
    outputs:
      image: The cut-out as a transparent PNG
      mask: Black-and-white mask (white is kept)
