id: ffmpeg.testsrc
name: 生成测试视频
category: media
description: 用 ffmpeg lavfi testsrc 生成一段测试视频。
params:
  type: object
  properties:
    duration: { type: number, default: 2 }
    size: { type: string, default: 320x240 }
    rate: { type: integer, default: 15 }
outputs:
  video: { type: file }
executor:
  kind: command
  bin: ffmpeg
  args: ["-y", "-hide_banner", "-loglevel", "error",
         "-f", "lavfi", "-i", "testsrc=duration={{params.duration}}:size={{params.size}}:rate={{params.rate}}",
         "-pix_fmt", "yuv420p", "{{ctx.outDir}}/testsrc.mp4"]
  outputs:
    video: "{{ctx.outDir}}/testsrc.mp4"
cache: true
